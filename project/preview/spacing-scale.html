<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 24px; }
  .row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 10px; align-items: center; padding: 3px 0; font-size: 12px; }
  .name { font-family: var(--font-mono); color: var(--bw-ink-2); }
  .bar { height: 8px; background: var(--bw-strom-700); border-radius: 1px; }
  .px { font-family: var(--font-mono); color: var(--bw-mute); text-align: right; }
</style></head>
<body>
  <div class="row"><span class="name">--sp-1</span><span class="bar" style="width:4px"></span><span class="px">4</span></div>
  <div class="row"><span class="name">--sp-2</span><span class="bar" style="width:8px"></span><span class="px">8</span></div>
  <div class="row"><span class="name">--sp-3</span><span class="bar" style="width:12px"></span><span class="px">12</span></div>
  <div class="row"><span class="name">--sp-4</span><span class="bar" style="width:16px"></span><span class="px">16</span></div>
  <div class="row"><span class="name">--sp-6</span><span class="bar" style="width:24px"></span><span class="px">24</span></div>
  <div class="row"><span class="name">--sp-8</span><span class="bar" style="width:32px"></span><span class="px">32</span></div>
  <div class="row"><span class="name">--sp-12</span><span class="bar" style="width:48px"></span><span class="px">48</span></div>
  <div class="row"><span class="name">--sp-16</span><span class="bar" style="width:64px"></span><span class="px">64</span></div>
  <div class="row"><span class="name">--sp-24</span><span class="bar" style="width:96px"></span><span class="px">96</span></div>
</body></html>
