<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Akzentfarben</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--bw-paper); }
  .group { margin-bottom: 14px; }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid var(--bw-line); background:#fff; }
  .chip { height: 48px; }
  .meta { padding: 6px 8px; font-size: 11px; line-height: 1.3; }
  .name { font-weight: 600; }
  .hex { color: var(--bw-mute); font-family: var(--font-mono); font-size: 10px; }
  h6 { margin: 0 0 8px 0; }
</style></head>
<body>
  <div class="group">
    <h6>Ufer — warmer Stein (zweite Stimme)</h6>
    <div class="row">
      <div class="sw"><div class="chip" style="background:#EBEFDD"></div><div class="meta"><div class="name">50</div><div class="hex">#EBEFDD</div></div></div>
      <div class="sw"><div class="chip" style="background:#DFE5CE"></div><div class="meta"><div class="name">100</div><div class="hex">#DFE5CE</div></div></div>
      <div class="sw"><div class="chip" style="background:#A5B387"></div><div class="meta"><div class="name">500</div><div class="hex">#A5B387</div></div></div>
      <div class="sw"><div class="chip" style="background:#82935F"></div><div class="meta"><div class="name">600 ★</div><div class="hex">#82935F</div></div></div>
      <div class="sw"><div class="chip" style="background:#6A7A4A"></div><div class="meta"><div class="name">700</div><div class="hex">#6A7A4A</div></div></div>
    </div>
  </div>
  <div class="group">
    <h6>Ziegel — Terracotta (sehr sparsam, 1× pro Seite; z. B. Team Ost)</h6>
    <div class="row" style="grid-template-columns: repeat(3, 1fr); max-width: 60%;">
      <div class="sw"><div class="chip" style="background:#EFD9CF"></div><div class="meta"><div class="name">100</div><div class="hex">#EFD9CF</div></div></div>
      <div class="sw"><div class="chip" style="background:#A45A44"></div><div class="meta"><div class="name">600 ★</div><div class="hex">#A45A44</div></div></div>
      <div class="sw"><div class="chip" style="background:#8C4A36"></div><div class="meta"><div class="name">700</div><div class="hex">#8C4A36</div></div></div>
    </div>
  </div>
</body></html>
