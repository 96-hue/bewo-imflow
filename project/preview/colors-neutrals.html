<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Brand neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid var(--bw-line); background:#fff; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-size: 12px; line-height: 1.35; }
  .name { font-weight: 600; color: var(--bw-ink); }
  .hex { color: var(--bw-mute); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F6F2EC"></div><div class="meta"><div class="name">Paper</div><div class="hex">#F6F2EC · --bw-paper</div></div></div>
    <div class="sw"><div class="chip" style="background:#ECE7DD"></div><div class="meta"><div class="name">Paper&nbsp;2</div><div class="hex">#ECE7DD · --bw-paper-2</div></div></div>
    <div class="sw"><div class="chip" style="background:#DAD3C4"></div><div class="meta"><div class="name">Line</div><div class="hex">#DAD3C4 · --bw-line</div></div></div>
    <div class="sw"><div class="chip" style="background:#B5AD9C"></div><div class="meta"><div class="name">Line&nbsp;Strong</div><div class="hex">#B5AD9C</div></div></div>
    <div class="sw"><div class="chip" style="background:#82935F"></div><div class="meta"><div class="name">Mute</div><div class="hex">#82935F · --bw-mute</div></div></div>
    <div class="sw"><div class="chip" style="background:#4C5352"></div><div class="meta"><div class="name">Ink&nbsp;2</div><div class="hex">#4C5352 · --bw-ink-2</div></div></div>
    <div class="sw"><div class="chip" style="background:#2A2A28"></div><div class="meta"><div class="name">Ink</div><div class="hex">#2A2A28 · --bw-ink</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--bw-line)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body></html>
