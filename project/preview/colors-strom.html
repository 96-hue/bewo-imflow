<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Strom — Markenfarbe</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .row { display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid var(--bw-line); background:#fff; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-size: 12px; line-height: 1.35; }
  .name { font-weight: 600; }
  .hex { color: var(--bw-mute); font-family: var(--font-mono); font-size: 11px; }
  h6 { margin: 0 0 12px 0; }
</style></head>
<body>
  <h6>Strom — Markenfarbe (Petrol/Schiefer)</h6>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#E5ECEA"></div><div class="meta"><div class="name">50</div><div class="hex">#E5ECEA</div></div></div>
    <div class="sw"><div class="chip" style="background:#D4DEDC"></div><div class="meta"><div class="name">100</div><div class="hex">#D4DEDC</div></div></div>
    <div class="sw"><div class="chip" style="background:#5A8380"></div><div class="meta"><div class="name">500</div><div class="hex">#5A8380</div></div></div>
    <div class="sw"><div class="chip" style="background:#3C6663"></div><div class="meta"><div class="name">600</div><div class="hex">#3C6663</div></div></div>
    <div class="sw"><div class="chip" style="background:#2B524F"></div><div class="meta"><div class="name">700</div><div class="hex">#2B524F</div></div></div>
    <div class="sw"><div class="chip" style="background:#1E3F3D;outline:2px solid #B57A2A;outline-offset:-2px"></div><div class="meta"><div class="name">800 · Brand</div><div class="hex">#1E3F3D</div></div></div>
  </div>
</body></html>
