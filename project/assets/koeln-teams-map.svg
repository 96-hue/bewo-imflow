    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="-10" width="14" height="14" fill="url(#eastHatch)" stroke="#A45A44" stroke-width="0.6"></rect>
      <circle cx="7" cy="-3" r="3.5" fill="#A45A44"></circle>
      <text x="22" y="0">Team Ost — rechtsrheinisch</text>
    </g>
    <g transform="translate(520, 0)">
      <line x1="0" y1="-3" x2="14" y2="-3" stroke="#5A8380" stroke-width="4" stroke-linecap="round" opacity="0.7"></line>
      <text x="22" y="0">Rhein</text>
    </g>
  </g>

  
  <text x="60" y="50" font-family="Source Serif 4, Georgia, serif" font-size="16" fill="#4C5352">Köln · 16 Mitarbeitende · zwei Teams</text>
