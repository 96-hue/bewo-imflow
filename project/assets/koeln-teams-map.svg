<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Stadtgebiet Köln mit Teams West und Ost, getrennt durch den Rhein">
  <defs>
    <pattern id="westHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1E3F3D" stroke-width="0.6" opacity="0.18"></line>
    </pattern>
    <pattern id="eastHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A45A44" stroke-width="0.6" opacity="0.22"></line>
    </pattern>
  </defs>

  
  <path d="&#xA;    M 80 210&#xA;    Q 70 150, 130 120&#xA;    Q 190 80, 270 85&#xA;    Q 340 60, 410 95&#xA;    Q 490 75, 560 120&#xA;    Q 630 150, 640 230&#xA;    Q 660 310, 600 380&#xA;    Q 540 450, 440 450&#xA;    Q 350 470, 270 440&#xA;    Q 170 420, 120 360&#xA;    Q 60 300, 80 210 Z" fill="#F6F2EC" stroke="#1E3F3D" stroke-width="1.2" opacity="1"></path>

  
  <clipPath id="clipCity">
    <path d="&#xA;      M 80 210&#xA;      Q 70 150, 130 120&#xA;      Q 190 80, 270 85&#xA;      Q 340 60, 410 95&#xA;      Q 490 75, 560 120&#xA;      Q 630 150, 640 230&#xA;      Q 660 310, 600 380&#xA;      Q 540 450, 440 450&#xA;      Q 350 470, 270 440&#xA;      Q 170 420, 120 360&#xA;      Q 60 300, 80 210 Z"></path>
  </clipPath>

  <g clip-path="url(#clipCity)">
    
    <path d="M 0 0 L 400 0 Q 380 100, 360 180 Q 340 260, 320 340 Q 300 420, 280 520 L 0 520 Z" fill="url(#westHatch)"></path>
    
    <path d="M 400 0 L 720 0 L 720 520 L 280 520 Q 300 420, 320 340 Q 340 260, 360 180 Q 380 100, 400 0 Z" fill="url(#eastHatch)"></path>
  </g>

  
  <path d="M 400 0 Q 380 100, 360 180 Q 340 260, 320 340 Q 300 420, 280 520" fill="none" stroke="#5A8380" stroke-width="10" stroke-linecap="round" opacity="0.55"></path>
  <path d="M 400 0 Q 380 100, 360 180 Q 340 260, 320 340 Q 300 420, 280 520" fill="none" stroke="#1E3F3D" stroke-width="1.4" stroke-linecap="round"></path>

  
  <g stroke="#1E3F3D" stroke-width="0.8" opacity="0.35" fill="none">
    <path d="M 385 80 q 6 2, 10 0"></path>
    <path d="M 368 160 q 6 2, 10 0"></path>
    <path d="M 348 260 q 6 2, 10 0"></path>
    <path d="M 320 360 q 6 2, 10 0"></path>
    <path d="M 300 450 q 6 2, 10 0"></path>
  </g>

  
  <g stroke="#1E3F3D" stroke-width="1.1" fill="none" opacity="0.7">
