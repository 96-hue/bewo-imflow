    <line x1="335" y1="280" x2="375" y2="280"></line>
    <line x1="308" y1="400" x2="348" y2="400"></line>
  </g>

  
  <g font-family="Inter, sans-serif" font-size="12" fill="#2A2A28">
    
    <circle cx="180" cy="170" r="4.5" fill="#1E3F3D"></circle>
    <text x="190" y="174">Ehrenfeld</text>
    
    <circle cx="250" cy="130" r="4.5" fill="#1E3F3D"></circle>
