  <g transform="translate(600, 110)" fill="none" stroke="#4C5352" stroke-width="1">
    <line x1="0" y1="30" x2="0" y2="0"></line>
    <path d="M -5 6 L 0 0 L 5 6" fill="#4C5352" stroke="none"></path>
    <text x="-3" y="48" font-family="Inter, sans-serif" font-size="11" fill="#4C5352" stroke="none">N</text>
  </g>

  
  <g transform="translate(60, 455)" font-family="Inter, sans-serif" font-size="12" fill="#2A2A28">
    <g>
      <rect x="0" y="-10" width="14" height="14" fill="url(#westHatch)" stroke="#1E3F3D" stroke-width="0.6"></rect>
      <circle cx="7" cy="-3" r="3.5" fill="#1E3F3D"></circle>
